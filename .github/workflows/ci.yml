name: CI

# Quality gate: every push/PR to main must typecheck and build before it can
# be considered safe to deploy. This catches the class of regression that has
# bitten production (type errors, broken imports, build failures) before users
# ever see them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # .npmrc sets legacy-peer-deps=true (the @zxing peer conflict), so this resolves.
      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      # App code must be type-clean. (Test-only tsconfig is checked separately.)
      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      # Guard against re-introducing manualChunks — splitting react/@radix-ui into
      # separate vendor chunks made Radix evaluate before React and blacked out
      # production. The prose comment in vite.config is fine; an active
      # `manualChunks:` / `manualChunks(` config fails the build.
      - name: Guard against manualChunks regression
        run: |
          if grep -nE "manualChunks[[:space:]]*[:(]" vite.config.ts; then
            echo "::error::manualChunks config detected in vite.config.ts — this previously caused a production black screen. Remove it."
            exit 1
          fi

      - name: Production build
        run: npx vite build
