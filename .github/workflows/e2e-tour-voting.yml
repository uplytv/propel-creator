name: E2E — Tour-demand voting

# Runs the Tour-demand voting widget tests (ranking, one-vote-per-device,
# realtime re-rank) on every push/PR. Reports pass/fail via the standard
# GitHub check, publishes the JUnit summary, and on failure uploads the
# captured DOM snapshots + error traces as a downloadable artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-tour-voting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour-voting:
    name: Tour-demand voting widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run tour-demand voting tests
        run: npm run test:tour

      - name: Publish JUnit test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-artifacts/tour-junit.xml
          check_name: Tour-demand voting tests
          fail_on_failure: true
          require_tests: true

      - name: Upload failure artifacts (DOM snapshots + errors)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tour-voting-failure-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
